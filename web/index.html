<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efe9e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)" />
    <title>Tastemate</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='10' fill='%23e5533c'/><circle cx='11.5' cy='15' r='3' fill='%231f2433'/><circle cx='20.5' cy='15' r='3' fill='%231f2433'/><circle cx='12.5' cy='14' r='1' fill='white'/><circle cx='21.5' cy='14' r='1' fill='white'/><path d='M13 21q3 2.5 6 0' stroke='%231f2433' stroke-width='2' fill='none' stroke-linecap='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('tm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('tm-accent');
        document.documentElement.dataset.accent = /^(apricot|sage|lavender|ocean|rose)$/.test(a) ? a : 'apricot';
      } catch (e) {
        document.documentElement.dataset.accent = 'apricot';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tastemate needs JavaScript turned on.</noscript>
    <script>
      // If the app hasn't drawn anything after a few seconds, say why instead of staying blank.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="max-width:560px;margin:15vh auto;padding:0 20px;font-family:system-ui,sans-serif;line-height:1.5">' +
            '<h1 style="font-family:Georgia,serif">Tastemate didn’t start</h1>' +
            '<p>The page loaded but the app code didn’t run. Check that you opened <b>http://localhost:5173</b> while <code>npm run dev</code> is running, ' +
            'and that your browser is up to date (current Chrome, Edge, Firefox or Safari). The browser console (F12) will show the exact error.</p></div>';
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
